<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form Assignment">
    <meta name="author" content="Mezger Abrão">

    <title>Product Review Form</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

    <form method="get" action="review.html">

        <div class="form-group">
            <label for="productName">Product Name *</label>

            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
        </div>

        <fieldset>
            <legend>Overall Rating *</legend>

            <label>
                <input type="radio" name="rating" value="1" required>
                ☆
            </label>

            <label>
                <input type="radio" name="rating" value="2">
                ☆☆
            </label>

            <label>
                <input type="radio" name="rating" value="3">
                ☆☆☆
            </label>

            <label>
                <input type="radio" name="rating" value="4">
                ☆☆☆☆
            </label>

            <label>
                <input type="radio" name="rating" value="5">
                ☆☆☆☆☆
            </label>

        </fieldset>

        <div class="form-group">
            <label for="installDate">Date of Installation *</label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required>
        </div>

        <fieldset>
            <legend>Useful Features (Check all that apply)</legend>

            <label>
                <input type="checkbox" id="durability" name="features" value="Durability">
                Durability
            </label>

            <label>
                <input type="checkbox" id="ease" name="features" value="Ease of Use">
                Ease of Use
            </label>

            <label>
                <input type="checkbox" id="performance" name="features" value="Performance">
                Performance
            </label>

            <label>
                <input type="checkbox" id="design" name="features" value="Design">
                Design
            </label>
        </fieldset>

        <div class="form-group">
            <label for="review">Written Review (Optional)</label>

            <textarea
                id="review"
                name="review"
                rows="6"></textarea>
        </div>

        <div class="form-group">
            <label for="userName">Your Name (Optional)</label>

            <input
                type="text"
                id="userName"
                name="userName">
        </div>

        <input type="submit" value="Post Review" class="submit-btn">

    </form>

</main>

<footer>
    <p>
        © <span id="currentyear"></span> | Mezger Abrão | Brazil
    </p>

    <p id="lastModified"></p>
</footer>

</body>
</html>
