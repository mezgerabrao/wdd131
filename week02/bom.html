<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Book of Mormon Top 10 Favorite Chapters" />
    <meta name="author" content="Mezger Abrão">
    <title>Book of Mormon – Top 10</title>
    <link rel="stylesheet" href="styles/bom.css" />
  </head>
  <body>
    <header>
      <h1>📖 Book of Mormon - Top 10</h1>
    </header>
 
    <main>
      <section class="input-section">
        <label for="favchap">Enter Book and Chapter:</label>
        <input
          type="text"
          id="favchap"
          placeholder="Alma 5"
          autocomplete="off"
        />
        <button type="button" id="add-btn">Add Chapter</button>
      </section>
 
      <p id="warning" role="alert" hidden></p>
 
      <p id="entry-count">0 / 10 chapters</p>
 
      <ul id="chapter-list"></ul>
    </main>
 
    <script src="scripts/bom.js"></script>
  </body>
</html>
