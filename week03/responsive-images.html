<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Images Activity</title>

    <meta name="description" content="Responsive images activity for WDD 131">
    <meta name="author" content="Mezger Abrão">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/responsive-images.css">
</head>

<body>

<main>

    <div class="hero">

        <picture>

            <source
                srcset="images/hero-large.webp"
                media="(min-width: 1000px)">

            <source
                srcset="images/hero-medium.webp"
                media="(min-width: 500px)">

            <img
                src="images/hero-small.webp"
                alt="Temple exterior and surrounding landscape"
                width="1500"
                height="750">

        </picture>

    </div>

</main>

</body>
</html>
